name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (main module)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        # 判据是「输出非空即失败」——`gofmt -l` 列完未格式化文件仍退出 0，只抄命令行
        # 等于把门禁降级成仪式。gofmt 走工具链显式路径：PATH 上可能是旧版二进制，
        # 解析不了新语法（全量假阳性）。
        run: |
          files="$(git ls-files '*.go')"
          out="$("$(go env GOROOT)/bin/gofmt" -l $files 2>&1)" || true
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
          echo "gofmt clean: $(echo "$files" | wc -l) file(s)"
      - name: Test
        # 包清单与根 README「构建与测试」节的权威回归命令逐字一致；
        # TestLive 系 live 用例，无凭证时自动跳过。
        run: go test -race -count=1 -skip TestLive ./kernel/... ./llm/... ./loop/ ./toolset/... ./skills/ ./textsplit/... ./memory/... ./host/ ./observability/
      - name: Test eval (property tests)
        run: go test -race -count=1 ./eval/

  test-eval-war:
    name: test (eval/war nested module)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval/war
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: eval/war/go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -count=1 ./...
