name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: gofmt
        # 判据是「输出非空即失败」——`gofmt -l` 列完未格式化文件仍退出 0，只抄命令行
        # 等于把门禁降级成仪式。gofmt 走工具链显式路径：PATH 上可能是旧版二进制，
        # 解析不了新语法（全量假阳性）。
        run: |
          files="$(git ls-files '*.go')"
          out="$("$(go env GOROOT)/bin/gofmt" -l $files 2>&1)" || true
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
          echo "gofmt clean: $(echo "$files" | wc -l) file(s)"
      - name: Test
        run: go test -race -count=1 ./...

  benchmark-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: benchmarks/dag
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/dag/go.mod
          cache-dependency-path: benchmarks/dag/go.sum
      - name: Build isolated benchmark adapters
        run: go build ./...
      - name: Vet benchmark adapters
        run: go vet ./...
      - name: Check equal results, execution counts and concurrency
        run: go test -race -count=1 -timeout=180s ./...
      # Full timing matrices run manually on one machine; CI latency is not a performance gate.
