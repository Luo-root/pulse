name: Bug report
description: Something behaves differently from what the documentation or the design says.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **A bug that cannot be reproduced cannot be fixed** — the fields
        below are the minimum needed to act on it.

        **Security problems do not belong here.** Report them privately as described in
        [SECURITY.md](https://github.com/Luo-root/pulse/blob/main/SECURITY.md).

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened — and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Minimal, runnable steps or code. Trim the case down until only the bug remains; a
        self-contained `main.go` or a single failing test is ideal.
      placeholder: |
        go test -run TestX ./package/...
        # or a self-contained main.go
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pulse version
      description: The release tag you use (see Releases), or the commit if you track main.
      placeholder: v0.2.3
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, Go version, and the provider/model if the bug involves a model call.
      placeholder: |
        OS: Windows 11 24H2 / Ubuntu 24.04
        Go: go1.25.0 windows/amd64
        Provider: openai (or "not involved")
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the full error, including the stack trace. Redact anything sensitive — no API keys, no tokens.
      render: shell
    validations:
      required: false

  - type: textarea
    id: regression
    attributes:
      label: First known bad version / workaround
      description: If this used to work, which version broke it? If you found a workaround, what is it?
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I have read CONTRIBUTING.md and included a way to reproduce the problem.
          required: true
        - label: This is not a security vulnerability — those go to SECURITY.md, not the issue tracker.
          required: true
