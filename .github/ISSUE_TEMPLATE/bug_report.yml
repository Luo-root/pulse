name: 缺陷报告
description: 实际行为与文档或设计约定不符。
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请用中文填写标题和正文，代码标识符、命令和错误原文保留原样。
        **无法复现的问题无法修复**，以下信息是定位问题所需的最小材料。

        **安全漏洞不要在这里公开提交。** 请按
        [SECURITY.md](https://github.com/Luo-root/pulse/blob/main/SECURITY.md) 私下报告。

  - type: textarea
    id: actual
    attributes:
      label: 实际行为与预期行为
      description: 实际发生了什么，原本预期是什么。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: |
        提供最小且可运行的步骤或代码。请删去与缺陷无关的部分，
        最好是一份可以独立执行的 main.go 或一个失败测试。
      placeholder: |
        go test -run TestX ./package/...
        // 或提供可独立执行的 main.go
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Pulse 版本
      description: 使用的发布标签（见 Releases）；如果跟踪 main，请填写提交哈希。
      placeholder: v0.5.1
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、架构，以及编译时使用的 Go 版本。
      placeholder: |
        操作系统：Windows 11 / Ubuntu 24.04
        Go：go1.26.0 windows/amd64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或错误输出
      description: 请保留完整错误与堆栈，并隐藏敏感信息；不要提交 API key、token 或私钥。
      render: shell
    validations:
      required: false

  - type: textarea
    id: regression
    attributes:
      label: 首个异常版本与临时解决办法
      description: 如果以前能正常使用，从哪个版本开始出现问题？如果有临时解决办法，请一并说明。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认不是重复问题。
          required: true
        - label: 已阅读 CONTRIBUTING.md，并提供复现方式。
          required: true
        - label: 这不是安全漏洞；安全问题应按 SECURITY.md 私下报告。
          required: true
